version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: zecratary-postgres
    restart: always
    environment:
      POSTGRES_USER: zecratary_user
      POSTGRES_PASSWORD: zecratary_secure_password
      POSTGRES_DB: zecratary_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: zecratary-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
